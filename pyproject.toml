[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymerlin"
version = "0.2.1"
dependencies = [
  "spiceypy>=6.0.0",
  "bokeh>=3.4.2",
  "numpy>=2.0.0",
]
requires-python = ">=3.10"
authors = [
  {name = "Matthew Dailis", email = "matthew.l.dailis@jpl.nasa.gov"},
]
maintainers = [
]
description = "Python mission modeling framework for Aerie"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["aerie", "merlin", "simulation", "discrete event"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python"
]

#[project.optional-dependencies]
#gui = ["PyQt5"]
#cli = [
#  "rich",
#  "click",
#]

[project.urls]
Homepage = "https://remy-rabideau.github.io/pymerlin"
Documentation = "https://remy-rabideau.github.io/pymerlin"
Repository = "https://github.com/remy-rabideau/pymerlin"
"Bug Tracker" = "https://github.com/remy-rabideau/pymerlin/issues"
Changelog = "https://github.com/remy-rabideau/pymerlin/blob/main/CHANGELOG.md"

[project.scripts]
pymerlin = "pymerlin._internal._cli:main"
#
#[project.gui-scripts]
#spam-gui = "spam:main_gui"
#
#[project.entry-points."spam.magical"]
#tomatoes = "spam:main_tomatoes"

[tool.hatch.build.targets.sdist]
include = [
  "pymerlin",
]
exclude = [
  "java", "docs", "tests"
]