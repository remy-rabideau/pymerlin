plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def plandevPath = System.getenv('PLANDEV_PATH') ?: "${rootDir}/../../plandev"

repositories {
    mavenCentral()
    flatDir {
        dirs "${plandevPath}/merlin-sdk/build/libs",
             "${plandevPath}/merlin-framework/build/libs",
             "${plandevPath}/contrib/build/libs",
             "${plandevPath}/merlin-driver/build/libs",
             "${plandevPath}/type-utils/build/libs",
             "${plandevPath}/orchestration-utils/build/libs",
             "${plandevPath}/parsing-utilities/build/libs"
    }
}

// GraalPy version. MUST match `graalPyVersion` in plandev's gradle.properties, which
// is what puts these jars on the merlin-worker / merlin-server runtime classpath.
// plandev is a separate Gradle build, so this cannot be read from there — bumping one
// means bumping both. Get it wrong and the shim compiles fine, then fails at runtime
// in a worker log against an API the worker does not actually provide.
ext.graalPyVersion = '25.0.2'

dependencies {
    // merlin-sdk is provided by Aerie's classloader at runtime — do not bundle
    compileOnly name: 'merlin-sdk'
    // merlin-framework is NOT in the worker runtime classpath — must be bundled
    implementation name: 'merlin-framework'
    compileOnly name: 'contrib'
    // gson is not provided by Aerie, so bundle it
    // (droppable once the JSON protocol is gone — Phase 3, §6.3)
    implementation 'com.google.code.gson:gson:2.11.0'

    // --- GraalPy: provided by merlin-worker at runtime — do NOT bundle (§4.3) ---
    //
    // `compileOnly` is load-bearing here, not stylistic. The `jar` block below folds
    // configurations.runtimeClasspath into the model JAR, so `implementation` would
    // pack the Python language + Truffle runtime — hundreds of megabytes — into every
    // model JAR a user uploads. compileOnly keeps them off runtimeClasspath entirely,
    // which is the same treatment merlin-sdk already gets and for the same reason: the
    // worker's parent classloader supplies them (Gate A-2 confirmed a shim in a child
    // loader can create a Context against them).
    compileOnly "org.graalvm.polyglot:polyglot:${graalPyVersion}"
    // `python` (a Maven-only <type>pom</type> artifact, no jar of its own) is
    // deliberately NOT declared here or on the worker/server. On merlin-worker/
    // -server, declaring it as a plain Gradle `implementation` dependency
    // resolved to the bare .pom file on the runtime classpath, which leaked
    // through orchestration-utils's `implementation project(':merlin-server')`
    // into stateless-aerie's fat-jar `jar` task and broke `./gradlew assemble`
    // ("Cannot expand ZIP '.../python-25.0.2.pom'", since zipTree() can't unzip
    // a .pom). Harmless here specifically (compileOnly never reaches this jar
    // task's own runtimeClasspath), but kept absent so this file matches what
    // the worker/server actually provide at runtime -- GraalPy's own current
    // Gradle docs never list it either, only `polyglot` + `python-embedding`.
    compileOnly "org.graalvm.python:python-embedding:${graalPyVersion}"

    // --- test-only: drive a real simulation through the PyBridge seam, no production impact ---
    // The subprocess-bridge half of the parity test always runs (needs only CPython + the
    // dev venv). The graal half is guarded by Assumptions and lights up only where a GraalPy
    // runtime + python-resources venv exist (i.e. the built worker image), so `./gradlew test`
    // on a stock JDK exercises the oracle without false-failing on the unproven path.
    //
    // polyglot/python-embedding are `compileOnly` above because in PRODUCTION the worker's
    // parent classloader supplies them. `./gradlew test` runs in a plain forked JVM with no
    // such parent classloader, so without these the graal-parity test fails immediately with
    // NoClassDefFoundError on GraalPyResources — even on a machine with the venv provisioned —
    // before it ever gets far enough to prove or disprove parity. testRuntimeOnly here, not
    // compileOnly: production behavior (main's runtimeClasspath, what ships in the jar) is
    // untouched; this is purely what the test JVM needs to load the classes it references.
    testRuntimeOnly "org.graalvm.polyglot:polyglot:${graalPyVersion}"
    testRuntimeOnly "org.graalvm.python:python-embedding:${graalPyVersion}"
    testImplementation name: 'merlin-sdk'
    testImplementation name: 'merlin-driver'
    testImplementation name: 'type-utils'
    testImplementation name: 'orchestration-utils'
    testImplementation name: 'parsing-utilities'
    testImplementation 'org.glassfish:javax.json:1.1.4'
    testImplementation 'it.unimi.dsi:fastutil:8.5.12'
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'
    testImplementation 'commons-cli:commons-cli:1.8.0'
    testImplementation 'org.apache.commons:commons-lang3:3.13.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    // Point the shim at the demo model and the repo's own dev venv so the subprocess
    // bridge's `import pymerlin` resolves. The graal half additionally needs a
    // python-resources venv (PYMERLIN_RESOURCES) and a GraalPy-tier JVM; absent those it
    // is skipped, not failed.
    systemProperty 'pymerlin.model.ref', file("${rootDir}/../demo/model.py").absolutePath + ':Mission'
    systemProperty 'pymerlin.python', file("${rootDir}/../venv/bin/python3").absolutePath

    // `test` forks a separate JVM — `-D` flags on the `./gradlew` command line only land
    // on the Gradle daemon, NOT that forked JVM, unless explicitly forwarded here. Without
    // this, `-Dpymerlin.test.graal=true` silently has no effect and the graal parity test
    // just skips with no error, which is exactly what happened the first time this ran.
    if (System.getProperty('pymerlin.test.graal') != null) {
        systemProperty 'pymerlin.test.graal', System.getProperty('pymerlin.test.graal')
    }
    if (System.getProperty('pymerlin.resources') != null) {
        systemProperty 'pymerlin.resources', System.getProperty('pymerlin.resources')
    }
    if (System.getProperty('pymerlin.bridge') != null) {
        systemProperty 'pymerlin.bridge', System.getProperty('pymerlin.bridge')
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Implementation-Title': 'pymerlin-shim',
        )
    }
    // Only include shim classes + bundled deps (gson); NOT the compileOnly Aerie JARs
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// --- Bridge parity: run inside the real image instead of copying its venv out --------
//
// Phase 2's exit criterion needs a GraalPy runtime + a real python-resources venv, i.e.
// the built worker image. GraalPyPreflight (merlin-worker) established the precedent for
// this exact class of problem -- "the property under test is a property of the built
// container image", not of the Gradle build -- by being a main() class run via `docker
// run --entrypoint java` rather than a JUnit test. BridgeParityTest's graal half is the
// same shape, but it also needs merlin-driver/orchestration-utils/JUnit on the classpath,
// none of which the runtime image carries. Bundling those in and running via the JUnit
// Console Launcher gets the same effect without a second main-class harness to maintain.
//
// Usage: run this task, then on the machine hosting the container:
//   docker exec aerie_merlin_worker_1 rm -rf /tmp/docker-test-bundle   # see note below
//   docker cp build/docker-test-bundle aerie_merlin_worker_1:/tmp/docker-test-bundle
//
// The `rm -rf` first matters: `docker cp` copies a local directory INTO an
// already-existing destination directory rather than overwriting its contents, so a
// second run without clearing the old copy first silently nests everything one level
// deeper (/tmp/docker-test-bundle/docker-test-bundle/...) and stale classes on the old
// classpath path mask the new ones -- new test classes fail with ClassNotFoundException
// while old ones still resolve, which reads as a partial failure but is really "you're
// running last time's bundle".
//   docker exec aerie_merlin_worker_1 java \
//     -cp "/tmp/docker-test-bundle/classes:/tmp/docker-test-bundle/lib/*" \
//     -Dpymerlin.model.ref=/usr/src/pymerlin/demo/model.py:Mission \
//     -Dpymerlin.python=python3 \
//     -Dpymerlin.resources=/opt/pymerlin/python-resources \
//     -Dpymerlin.test.graal=true \
//     org.junit.platform.console.ConsoleLauncher execute \
//     --select-class gov.nasa.ammos.aerie.pymerlin.shim.BridgeParityTest --details=verbose
//
// Nothing Python-related moves across the container boundary, so none of the SELinux/
// ownership/symlink-portability problems a venv copy hits are in play here — only class
// files and ordinary Maven jars, which docker cp handles cleanly.
configurations {
    consoleLauncher
}

dependencies {
    // Matches the junit-jupiter-engine/platform version resolved above (6.0.1) --
    // verified via `./gradlew :pymerlin-shim:dependencies --configuration testRuntimeClasspath`
    // rather than assumed, since mismatched engine/launcher versions fail cryptically.
    consoleLauncher 'org.junit.platform:junit-platform-console-standalone:6.0.1'
}

tasks.register('dockerTestBundle', Copy) {
    dependsOn testClasses
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into "${buildDir}/docker-test-bundle"
    into('classes') {
        from sourceSets.main.output
        from sourceSets.test.output
    }
    into('lib') {
        from configurations.testRuntimeClasspath
        from configurations.consoleLauncher
    }
}
